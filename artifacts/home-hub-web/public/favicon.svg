<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9663A"/>
      <stop offset="100%" stop-color="#9E2E0C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle top gloss -->
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>

  <!-- Chimney (behind roof so it appears to go through) -->
  <rect x="190" y="62" width="40" height="130" rx="6" fill="white"/>

  <!-- House: solid white roof + body as one path -->
  <!-- Roof triangle peak 256,104 · left eave 104,272 · right eave 408,272 -->
  <!-- Body: x=142–370, y=272–412 -->
  <path d="M256 104 L408 272 L370 272 L370 412 L142 412 L142 272 L104 272 Z" fill="white"/>

  <!-- Door — painted in mid-gradient color to appear as a cutout -->
  <rect x="214" y="316" width="84" height="96" rx="8" fill="#B84122"/>

  <!-- Door knob -->
  <circle cx="288" cy="370" r="7" fill="#D9663A"/>

  <!-- Left window -->
  <rect x="160" y="300" width="38" height="34" rx="5" fill="#B84122"/>
  <!-- Right window -->
  <rect x="314" y="300" width="38" height="34" rx="5" fill="#B84122"/>
</svg>
