kind = "mobile"
previewPath = "/mobile/"
title = "HomeHub"
version = "1.0.0"
id = "artifacts/home-hub"
router = "path"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21664

[services.development]
run = "pnpm --filter @workspace/home-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home-hub", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/home-hub", "run", "serve" ]

[services.env]
PORT = "21664"
BASE_PATH = "/mobile/"
