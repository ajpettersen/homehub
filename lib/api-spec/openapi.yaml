        workoutDate:
          type: string
          format: date
        title:
          type: string
        durationMinutes:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        exerciseCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - memberId
        - memberName
        - workoutDate
        - title
        - exerciseCount
        - createdAt

    Exercise:
      type: object
      properties:
        id:
          type: string
