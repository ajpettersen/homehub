openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HomeHub household management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: ai
    description: AI-powered meal suggestions and pantry scanning
  - name: workouts
    description: Workout logging and AI recommendations
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: family
    description: Family members
  - name: properties
    description: Properties (house and cabin)
  - name: chores
    description: Chore assignments and tracking
  - name: grocery
    description: Grocery lists and items
  - name: meals
    description: Meal planning
  - name: todos
    description: To-do lists and items
  - name: maintenance
    description: Home maintenance tasks and reminders
  - name: people
    description: Household people, follow-ups, and trusted contractors

paths:
  /ai/scan-pantry:
    post:
      operationId: scanPantry
      tags: [ai]
      summary: Scan a fridge/pantry photo and get ingredient list + meal suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imagesBase64]
              properties:
                imagesBase64:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryScanResult"

  /ai/meal-recipe:
    post:
      operationId: getMealRecipe
      tags: [ai]
      summary: Get full recipe details and an optional AI food photo for a named meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meal]
              properties:
                meal:
                  type: string
                generateImage:
                  type: boolean
      responses:
        "200":
          description: Recipe + optional food photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealRecipeResult"

  /ai/suggest-meals:
    post:
      operationId: suggestMeals
      tags: [ai]
      summary: Get AI meal suggestions based on meal history
      responses:
        "200":
          description: Meal suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestMealsResult"

  /ai/recommend-workout:
    post:
      operationId: recommendWorkout
      tags: [ai]
      summary: Get AI workout recommendation based on recent workout history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendWorkoutInput"
      responses:
        "200":
          description: Workout recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutRecommendation"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary for today
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /family-members:
    get:
      operationId: getFamilyMembers
      tags: [family]
      summary: List all family members
      responses:
        "200":
          description: List of family members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyMember"
    post:
      operationId: createFamilyMember
      tags: [family]
      summary: Create a new family member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyMemberInput"
      responses:
        "201":
          description: Created family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"

  /family-members/{id}:
    put:
      operationId: updateFamilyMember
      tags: [family]
      summary: Update a family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyMemberInput"
      responses:
        "200":
          description: Updated family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "404":
          description: Not found
    delete:
      operationId: deleteFamilyMember
      tags: [family]
      summary: Delete a family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties:
    get:
      operationId: getProperties
      tags: [properties]
      summary: List all properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "403":
          description: Forbidden

  /household:
    patch:
      operationId: updateHousehold
      tags: [users]
      summary: Rename the household or mark onboarding complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdInput"
      responses:
        "200":
          description: Updated household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "403":
          description: Forbidden

  /household/tab-visibility:
    put:
      operationId: updateHouseholdTabVisibility
      tags: [users]
      summary: Update household-wide HomeHub Web tab visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdTabVisibilityInput"
      responses:
        "200":
          description: Updated tab visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdTabVisibility"
        "400":
          description: Invalid tab visibility
        "403":
          description: Forbidden

  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [users]
      summary: Seed the household from first-login setup (transactional and idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding completed (or was already completed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResult"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /properties/{id}:
    put:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyInput"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found

  /properties/{id}/streetview:
    get:
      operationId: getPropertyStreetview
      tags: [properties]
      summary: Get a Google Street View image for a property (proxied)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No address set or not found
        "503":
          description: Street view not configured

  /chores:
    get:
      operationId: getChores
      tags: [chores]
      summary: List all chores
      parameters:
        - name: assigneeId
          in: query
          schema:
            type: string
        - name: propertyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of chores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chore"
    post:
      operationId: createChore
      tags: [chores]
      summary: Create a new chore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoreInput"
      responses:
        "201":
          description: Created chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"

  /chores/{id}:
    put:
      operationId: updateChore
      tags: [chores]
      summary: Update a chore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChoreInput"
      responses:
        "200":
          description: Updated chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
    delete:
      operationId: deleteChore
      tags: [chores]
      summary: Delete a chore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /chores/{id}/complete:
    post:
      operationId: completeChore
      tags: [chores]
      summary: Mark a chore as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteChoreInput"
      responses:
        "200":
          description: Updated chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"

  /grocery-lists:
    get:
      operationId: getGroceryLists
      tags: [grocery]
      summary: List all grocery lists
      responses:
        "200":
          description: List of grocery lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroceryList"
    post:
      operationId: createGroceryList
      tags: [grocery]
      summary: Create a grocery list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroceryListInput"
      responses:
        "201":
          description: Created grocery list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryList"

  /grocery-lists/{id}:
    delete:
      operationId: deleteGroceryList
      tags: [grocery]
      summary: Delete a grocery list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /grocery-lists/{id}/items:
    get:
      operationId: getGroceryItems
      tags: [grocery]
      summary: Get items in a grocery list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grocery items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroceryItem"
    post:
      operationId: addGroceryItem
      tags: [grocery]
      summary: Add item to grocery list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroceryItemInput"
      responses:
        "201":
          description: Created grocery item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryItem"

  /grocery-items/{id}:
    put:
      operationId: updateGroceryItem
      tags: [grocery]
      summary: Update a grocery item (check/uncheck, rename)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroceryItemInput"
      responses:
        "200":
          description: Updated grocery item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryItem"
    delete:
      operationId: deleteGroceryItem
      tags: [grocery]
      summary: Delete a grocery item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /meal-plans:
    get:
      operationId: getMealPlans
      tags: [meals]
      summary: List meal plans
      parameters:
        - name: weekStart
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of meal plan entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealPlanEntry"
    post:
      operationId: createMealPlanEntry
      tags: [meals]
      summary: Create or update a meal plan entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealPlanEntryInput"
      responses:
        "201":
          description: Created meal plan entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanEntry"

  /meal-plans/{id}:
    patch:
      operationId: updateMealPlanEntry
      tags: [meals]
      summary: Update rating or notes on a meal plan entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealPlanEntryInput"
      responses:
        "200":
          description: Updated meal plan entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteMealPlanEntry
      tags: [meals]
      summary: Delete a meal plan entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /meal-ratings:
    get:
      operationId: getMealRatings
      tags: [meals]
      summary: Get per-member ratings for a meal plan entry
      parameters:
        - name: mealPlanId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of per-member ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealRatingList"
    post:
      operationId: upsertMealRating
      tags: [meals]
      summary: Set (upsert) a per-member rating for a meal plan entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMealRatingInput"
      responses:
        "200":
          description: Upserted rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealRating"

  /meal-ratings/{id}:
    delete:
      operationId: deleteMealRating
      tags: [meals]
      summary: Remove a per-member rating
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /recipes:
    get:
      operationId: getRecipes
      tags: [meals]
      summary: List all saved recipes (cookbook) for a household
      parameters:
        - name: propertyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
    post:
      operationId: createRecipe
      tags: [meals]
      summary: Save a new recipe to the cookbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeInput"
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /recipes/{id}:
    put:
      operationId: updateRecipe
      tags: [meals]
      summary: Update a recipe (notes, timesCooked, aggregateRating)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeInput"
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
    delete:
      operationId: deleteRecipe
      tags: [meals]
      summary: Delete a recipe from the cookbook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get or create the current user's profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "201":
          description: Newly created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /admin/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all user profiles (admin)
      responses:
        "200":
          description: All user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /admin/users/{clerkId}:
    put:
      operationId: updateUserProfile
      tags: [users]
      summary: Update a user's role / property / linked family member
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /todo-lists:
    get:
      operationId: getTodoLists
      tags: [todos]
      summary: List all to-do lists
      responses:
        "200":
          description: List of to-do lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoList"
    post:
      operationId: createTodoList
      tags: [todos]
      summary: Create a to-do list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoListInput"
      responses:
        "201":
          description: Created to-do list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"

  /todo-lists/{id}:
    delete:
      operationId: deleteTodoList
      tags: [todos]
      summary: Delete a to-do list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /todo-lists/{id}/move-to-top:
    post:
      operationId: moveTodoListToTop
      tags: [todos]
      summary: Move a to-do list to the top of the Tasks page
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Moved

  /todo-lists/{id}/items:
    get:
      operationId: getTodoItems
      tags: [todos]
      summary: Get items in a to-do list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: To-do items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoItem"
    post:
      operationId: addTodoItem
      tags: [todos]
      summary: Add item to a to-do list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoItemInput"
      responses:
        "201":
          description: Created to-do item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"

  /todo-items/{id}:
    put:
      operationId: updateTodoItem
      tags: [todos]
      summary: Update a to-do item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoItemInput"
      responses:
        "200":
          description: Updated to-do item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
    delete:
      operationId: deleteTodoItem
      tags: [todos]
      summary: Delete a to-do item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /workouts:
    get:
      operationId: getWorkouts
      tags: [workouts]
      summary: List workouts
      parameters:
        - name: memberId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workout"
    post:
      operationId: createWorkout
      tags: [workouts]
      summary: Log a new workout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutInput"
      responses:
        "201":
          description: Created workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"

  /workouts/{id}:
    get:
      operationId: getWorkout
      tags: [workouts]
      summary: Get a workout with its exercises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workout with exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutDetail"
    delete:
      operationId: deleteWorkout
      tags: [workouts]
      summary: Delete a workout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /workouts/{id}/exercises:
    post:
      operationId: addExercise
      tags: [workouts]
      summary: Add an exercise to a workout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExerciseInput"
      responses:
        "201":
          description: Created exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"

  /workout-exercises/{id}:
    delete:
      operationId: deleteExercise
      tags: [workouts]
      summary: Remove an exercise from a workout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /maintenance-tasks:
    get:
      operationId: getMaintenanceTasks
      tags: [maintenance]
