          type: string
        name:
          type: string
        sets:
          type: integer
          nullable: true
        reps:
          type: integer
          nullable: true
        weightLbs:
          type: integer
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - workoutId
        - name

    WorkoutDetail:
      type: object
      properties:
        id:
          type: string
        memberId:
          type: string
        memberName:
          type: string
        workoutDate:
          type: string
          format: date
        title:
          type: string
        durationMinutes:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
